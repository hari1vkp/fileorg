name: build-app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            asset: fileorg-linux-x86_64.tar.gz
          - os: windows-latest
            name: windows-x86_64
            asset: fileorg-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pip
          python3 -m pip install --user pyinstaller

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install pyinstaller

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: python3 -m PyInstaller --noconfirm --clean fileorg.spec

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean fileorg.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp dist/fileorg package/
          cp README.md LICENSE package/
          tar -C package -czf "${{ matrix.asset }}" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/fileorg.exe package/
          Copy-Item README.md, LICENSE -Destination package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.asset }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: fileorg-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
